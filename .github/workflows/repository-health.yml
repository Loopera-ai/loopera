name: Repository health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject oversized tracked files outside data
        run: |
          while IFS= read -r -d '' path; do
            case "$path" in
              data/*|assets/data/*) continue ;;
            esac
            bytes="$(wc -c < "$path")"
            if [ "$bytes" -gt 10485760 ]; then
              echo "Tracked file exceeds 10 MiB: $path ($bytes bytes)"
              exit 1
            fi
          done < <(git ls-files -z)

      - name: Check public assets
        run: |
          file logo.png | grep -q 'JPEG image data'
          test "$(wc -c < assets/images/arch.png)" -gt 1024
          test -f assets/loopera.png
          test -f assets/docs/Loopera技术文档.pdf
