name: Repository health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject oversized tracked files
        run: |
          while IFS= read -r -d '' path; do
            bytes="$(wc -c < "$path")"
            if [ "$bytes" -gt 10485760 ]; then
              echo "Tracked file exceeds 10 MiB: $path ($bytes bytes)"
              exit 1
            fi
          done < <(git ls-files -z)

      - name: Check public assets
        run: |
          file logo.jpg | grep -q 'JPEG image data'
          test "$(wc -c < assets/images/loopera-system-workflow-agent-v2.png)" -gt 1024

      - name: Check public claims
        run: |
          if git grep -Ein 'cogalpha|通用代码与使用说明' -- README.md; then
            echo 'README contains an internal identifier or an unavailable-code claim.'
            exit 1
          fi
