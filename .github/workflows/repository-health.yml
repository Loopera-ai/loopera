name: Repository health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-repository-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check public assets
        run: |
          file logo.png | grep -q 'JPEG image data'
          test "$(wc -c < assets/images/arch.png)" -gt 1024
          test -f assets/loopera.png
          test -f assets/docs/Loopera技术文档.pdf