name: Documentation issue
description: Report inaccurate, unclear, outdated, or broken public material.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Loopera's public documentation.
  - type: input
    id: location
    attributes:
      label: Location
      description: Link to the section or name the affected file.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is inaccurate, unclear, outdated, or broken.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
      description: Describe the expected wording or behavior, if known.
